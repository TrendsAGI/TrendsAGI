# File: trendsagi-client/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trendsagi"
version = "0.17.0"
authors = [
  { name="TrendsAGI", email="contact@trendsagi.com" },
]
description = "Official TrendsAGI Python client and CLI: real-time trend intelligence for paid media targeting and timing, with a command line, AI agent tools, an MCP server, WebMCP support, and a Grok/Claude/Cursor plugin."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "trends", "trend detection", "trending topics", "social listening", "real-time data",
    "ai agents", "mcp", "model context protocol", "llm tools", "function calling",
    "marketing", "campaign optimization", "paid media", "ad targeting", "api client",
    "grok", "grok plugin", "chatgpt connector", "claude plugin",
    "webmcp", "browser agents",
    "cli", "command line", "terminal",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0",
    "websockets>=10.0"
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2; python_version >= '3.10'"]
langchain = ["langchain-core>=0.2"]

[project.scripts]
trendsagi = "trendsagi.cli:main"
trendsagi-mcp = "trendsagi.mcp_server:main"

[project.urls]
"Homepage" = "https://trendsagi.com"
"Documentation" = "https://trendsagi.com/api-docs"
"CLI" = "https://trendsagi.com/api-docs/integrations/cli"
"Source" = "https://github.com/TrendsAGI/TrendsAGI"
"Bug Tracker" = "https://github.com/TrendsAGI/TrendsAGI/issues" 

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trendsagi = ["cli_spec.json", "templates/Dockerfile", "templates/terraform/*.tf"]
