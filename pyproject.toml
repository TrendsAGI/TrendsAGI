# File: trendsagi-client/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trendsagi"
version = "0.8.0"
authors = [
  { name="TrendsAGI", email="contact@trendsagi.com" },
]
description = "Python utilities for TrendsAGI ad-platform execution helpers and scaffolding."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0"
]

[project.scripts]
trendsagi = "trendsagi.cli:main"

[project.urls]
"Homepage" = "https://github.com/TrendsAGI/TrendsAGI"
"Bug Tracker" = "https://github.com/TrendsAGI/TrendsAGI/issues" 

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trendsagi = ["templates/Dockerfile", "templates/terraform/*.tf"]
